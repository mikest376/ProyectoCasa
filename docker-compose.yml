# =============================================================================
# Odoo Data Lakehouse
#
# PRESUPUESTO DE MEMORIA: 13632 MiB de límites sobre los 16384 MiB de WSL.
# Un cambio de límite obliga a actualizar la tabla de CLAUDE.md en el mismo commit.
#
# Nada arranca sin un perfil explícito:
#   source         PostgreSQL 15 + Odoo 17
#   init           Inicialización de Odoo (un solo uso; usar scripts/init_odoo.sh)
#   streaming      Kafka (KRaft) + Debezium Connect
#   lakehouse      MinIO + Unity Catalog OSS
#   query          Trino
#   ai             Ollama con GPU NVIDIA
#   apps           Worker + FastAPI + Next.js
#   observability  Langfuse 2
#   caddy          Entrada externa (Odoo y frontend)
#
# Validar sin arrancar nada:
#   docker compose --env-file .env.example --profile "*" config --quiet
#
# PUERTOS: todos en 127.0.0.1. Caddy es el único que puede escuchar fuera, y solo si
# CADDY_BIND_IP se cambia de forma explícita (ver README, exposición para el TFG).
#
# IMÁGENES PROPIAS: odoo-db, odoo, caddy y trino llevan dentro su configuración, para que
# arranquen solas con Docker (TD-027). Tras editar infra/, repite el up con --build.
#
# REDES: cada servicio ve solo lo que necesita.
#   edge-odoo  Caddy y Odoo
#   edge-app   Caddy, frontend y backend
#   source     Odoo y su base de datos
#   langfuse   Langfuse y su base de datos
#   lakehouse  plano de datos (sin Odoo, sin frontend y sin Caddy)
# =============================================================================

name: odoo-lakehouse

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Las credenciales no son comunes: cada servicio usa su usuario de MinIO (TD-014).
x-s3-env: &s3-env
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}

# Ingesta, transformación y mantenimiento comparten imagen: un solo código que escribe Delta.
x-worker: &worker
  image: odoo-lakehouse/medallion-worker:dev
  build:
    context: ./services/medallion-worker

x-odoo: &odoo
  image: odoo-lakehouse/odoo:dev
  build:
    context: ./infra/odoo
  entrypoint: ["bash", "/opt/lakehouse/entrypoint.sh"]
  depends_on:
    odoo-db:
      condition: service_healthy
  volumes:
    - odoo-data:/var/lib/odoo
  deploy:
    resources:
      limits:
        memory: 768M

x-odoo-env: &odoo-env
  TZ: ${TZ:-UTC}
  HOST: odoo-db
  PORT: "5432"
  USER: ${ODOO_DB_USER:-odoo}
  PASSWORD: ${ODOO_DB_PASSWORD:?falta ODOO_DB_PASSWORD en .env}
  ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo}
  ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?falta ODOO_MASTER_PASSWORD en .env}

services:
  # ---------------------------------------------------------------------------
  # 1 · Origen
  # ---------------------------------------------------------------------------
  odoo-db:
    <<: *service
    image: odoo-lakehouse/odoo-db:dev
    build:
      context: ./infra/postgres
    profiles: ["source"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      TZ: ${TZ:-UTC}
      # Superusuario de administración. Odoo y Debezium usan sus propios roles.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?falta POSTGRES_SUPERUSER_PASSWORD en .env}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-odoo}
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?falta ODOO_DB_PASSWORD en .env}
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?falta DEBEZIUM_DB_PASSWORD en .env}
      DEBEZIUM_PUBLICATION_NAME: ${DEBEZIUM_PUBLICATION_NAME:-debezium_odoo_pub}
    networks: [source, lakehouse]
    ports:
      - "127.0.0.1:${ODOO_DB_PORT_HOST:-5433}:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: durante la inicialización, PostgreSQL solo escucha en el socket local.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$ODOO_DB_NAME\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  odoo:
    <<: [*service, *odoo]
    profiles: ["source"]
    command: ["odoo"]
    environment:
      <<: *odoo-env
    networks: [source, edge-odoo]
    ports:
      - "127.0.0.1:${ODOO_PORT_HOST:-8069}:8069"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Un solo uso: instala módulos y cierra los accesos por defecto.
  odoo-init:
    <<: [*service, *odoo]
    profiles: ["init"]
    restart: "no"
    command: ["bash", "/opt/lakehouse/init.sh"]
    environment:
      <<: *odoo-env
      ODOO_MODULES: ${ODOO_MODULES:-contacts,crm,sale_management,account,stock}
      # Solo la recibe este contenedor, no el servicio de Odoo.
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?falta ODOO_ADMIN_PASSWORD en .env}
    networks: [source]

  # ---------------------------------------------------------------------------
  # 2 · CDC y streaming
  # ---------------------------------------------------------------------------
  kafka:
    <<: *service
    image: apache/kafka:4.3.2
    profiles: ["streaming"]
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?falta KAFKA_CLUSTER_ID en .env}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT_HOST:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      # Los topics los crea Connect (topic.creation.*); así un error tipográfico
      # en un consumidor no genera topics fantasma.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    networks: [lakehouse]
    ports:
      - "127.0.0.1:${KAFKA_PORT_HOST:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Comprobación TCP: las CLI de Kafka arrancan otra JVM que heredaría
      # KAFKA_HEAP_OPTS y podría agotar el límite de memoria del contenedor.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/19092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M

  kafka-connect:
    <<: *service
    image: quay.io/debezium/connect:3.7.1.Final
    profiles: ["streaming"]
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: odoo-lakehouse-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Permite usar ${env:DEBEZIUM_DB_PASSWORD} en el JSON del conector, de modo
      # que la contraseña no se escribe en el repositorio ni en la API de Connect.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ^DEBEZIUM_.*
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:-odoo-postgres-cdc}
      DEBEZIUM_DB_NAME: ${ODOO_DB_NAME:-odoo}
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?falta DEBEZIUM_DB_PASSWORD en .env}
      DEBEZIUM_TOPIC_PREFIX: ${DEBEZIUM_TOPIC_PREFIX:-odoo}
      DEBEZIUM_SLOT_NAME: ${DEBEZIUM_SLOT_NAME:-debezium_odoo}
      DEBEZIUM_PUBLICATION_NAME: ${DEBEZIUM_PUBLICATION_NAME:-debezium_odoo_pub}
      DEBEZIUM_SCHEMA_INCLUDE_LIST: ${DEBEZIUM_SCHEMA_INCLUDE_LIST:-public}
      # El valor por defecto de la imagen es -Xmx2G y excede el presupuesto.
      HEAP_OPTS: -Xms256m -Xmx768m
    networks: [lakehouse]
    ports:
      - "127.0.0.1:${CONNECT_PORT_HOST:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://kafka-connect:8083/connectors >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

  # ---------------------------------------------------------------------------
  # 3 · Almacenamiento y catálogo
  # ---------------------------------------------------------------------------
  minio:
    <<: *service
    # MinIO ya no publica imágenes oficiales (ver TD-003). Imagen de Chainguard
    # fijada por digest porque su nivel gratuito solo ofrece el tag "latest".
    image: &minio-image cgr.dev/chainguard/minio:latest@sha256:f2e56aceb4d38ad9b05c901270946e2353b19f86ba4396f25cf75b15b455b38c
    profiles: ["lakehouse"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    networks: [lakehouse]
    ports:
      - "127.0.0.1:${MINIO_API_PORT_HOST:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 640M

  # Un solo uso: crea los buckets Medallion y un usuario por servicio con su política, y termina.
  minio-init:
    <<: *service
    image: *minio-image
    profiles: ["lakehouse"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MC_HOST_lake: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}@minio:9000
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-bronze}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:-silver}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:-gold}
      WORKER_S3_ACCESS_KEY_ID: ${WORKER_S3_ACCESS_KEY_ID:?falta WORKER_S3_ACCESS_KEY_ID en .env}
      WORKER_S3_SECRET_ACCESS_KEY: ${WORKER_S3_SECRET_ACCESS_KEY:?falta WORKER_S3_SECRET_ACCESS_KEY en .env}
      TRINO_S3_ACCESS_KEY_ID: ${TRINO_S3_ACCESS_KEY_ID:?falta TRINO_S3_ACCESS_KEY_ID en .env}
      TRINO_S3_SECRET_ACCESS_KEY: ${TRINO_S3_SECRET_ACCESS_KEY:?falta TRINO_S3_SECRET_ACCESS_KEY en .env}
      MAINTENANCE_S3_ACCESS_KEY_ID: ${MAINTENANCE_S3_ACCESS_KEY_ID:?falta MAINTENANCE_S3_ACCESS_KEY_ID en .env}
      MAINTENANCE_S3_SECRET_ACCESS_KEY: ${MAINTENANCE_S3_SECRET_ACCESS_KEY:?falta MAINTENANCE_S3_SECRET_ACCESS_KEY en .env}
    networks: [lakehouse]
    volumes:
      - ./infra/minio:/opt/lakehouse:ro
    entrypoint: ["/usr/bin/bash", "/opt/lakehouse/init.sh"]
    deploy:
      resources:
        limits:
          memory: 128M

  unity-catalog:
    <<: *service
    image: unitycatalog/unitycatalog:v0.7.0
    profiles: ["lakehouse"]
    environment:
      # La imagen no fija heap; la JVM lee esta variable de forma automática.
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
    networks: [lakehouse]
    ports:
      - "127.0.0.1:${UNITY_CATALOG_PORT_HOST:-8081}:8080"
    volumes:
      - unity-catalog-db:/home/unitycatalog/etc/db
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/2.1/unity-catalog/catalogs"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 640M

  # ---------------------------------------------------------------------------
  # 4 · Consulta e IA
  # ---------------------------------------------------------------------------
  trino:
    <<: *service
    image: odoo-lakehouse/trino:dev
    build:
      context: ./infra/trino
    profiles: ["query"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
        required: false
    environment:
      <<: *s3-env
      S3_ACCESS_KEY_ID: ${TRINO_S3_ACCESS_KEY_ID:?falta TRINO_S3_ACCESS_KEY_ID en .env}
      S3_SECRET_ACCESS_KEY: ${TRINO_S3_SECRET_ACCESS_KEY:?falta TRINO_S3_SECRET_ACCESS_KEY en .env}
    networks: [lakehouse]
    ports:
      - "127.0.0.1:${TRINO_PORT_HOST:-8080}:8080"
    volumes:
      - trino-data:/data/trino
    healthcheck:
      # La comprobación de la imagen, con más margen: en frío tarda unos 40 s en arrancar.
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3072M # heap 2 GiB (jvm.config) + memoria fuera de heap

  ollama:
    <<: *service
    image: ollama/ollama:0.40.18
    profiles: ["ai"]
    environment:
      # Un modelo y una petición a la vez: la VRAM no admite más (ver CLAUDE.md).
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Los datos del ERP no deben salir del host.
      OLLAMA_NO_CLOUD: "1"
    networks: [lakehouse]
    ports:
      - "127.0.0.1:${OLLAMA_PORT_HOST:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2560M # el modelo 3B cabe en la GPU; margen para capas en CPU (TD-001)
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # 5 · Servicios propios
  # ---------------------------------------------------------------------------
  # Kafka -> Bronze
  medallion-worker:
    <<: [*service, *worker]
    profiles: ["apps"]
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    environment:
      <<: *s3-env
      S3_ACCESS_KEY_ID: ${WORKER_S3_ACCESS_KEY_ID:?falta WORKER_S3_ACCESS_KEY_ID en .env}
      S3_SECRET_ACCESS_KEY: ${WORKER_S3_SECRET_ACCESS_KEY:?falta WORKER_S3_SECRET_ACCESS_KEY en .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      WORKER_CONSUMER_GROUP: ${WORKER_CONSUMER_GROUP:-medallion-worker}
      WORKER_TOPIC_PATTERN: ${WORKER_TOPIC_PATTERN:-}
      WORKER_BATCH_MAX_RECORDS: ${WORKER_BATCH_MAX_RECORDS:-5000}
      WORKER_BATCH_MAX_BYTES: ${WORKER_BATCH_MAX_BYTES:-33554432}
      WORKER_BATCH_MAX_SECONDS: ${WORKER_BATCH_MAX_SECONDS:-30}
      WORKER_PARTITIONED_TABLES: ${WORKER_PARTITIONED_TABLES:-}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-bronze}
      POLARS_MAX_THREADS: "4"
    networks: [lakehouse]
    healthcheck:
      # El bucle de consumo actualiza este fichero en cada vuelta.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/medallion-worker.alive) )) -lt 60"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  # Bronze -> Silver -> Gold y registro en Trino y Unity Catalog. Mismo usuario de MinIO que la
  # ingesta, pero nunca escribe las mismas tablas.
  medallion-transform:
    <<: [*service, *worker]
    profiles: ["apps"]
    command: ["python", "-m", "medallion_worker", "transform"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
        required: false
      trino:
        condition: service_healthy
        required: false
      unity-catalog:
        condition: service_healthy
        required: false
    environment:
      <<: *s3-env
      S3_ACCESS_KEY_ID: ${WORKER_S3_ACCESS_KEY_ID:?falta WORKER_S3_ACCESS_KEY_ID en .env}
      S3_SECRET_ACCESS_KEY: ${WORKER_S3_SECRET_ACCESS_KEY:?falta WORKER_S3_SECRET_ACCESS_KEY en .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_TRANSFORM_SECONDS: ${WORKER_TRANSFORM_SECONDS:-60}
      WORKER_LANGUAGE: ${WORKER_LANGUAGE:-es_ES}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-bronze}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:-silver}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:-gold}
      TRINO_URL: http://${TRINO_HOST:-trino}:${TRINO_PORT:-8080}
      TRINO_CATALOG: ${TRINO_CATALOG:-lakehouse}
      UNITY_CATALOG_URL: ${UNITY_CATALOG_URL:-http://unity-catalog:8080}
      UNITY_CATALOG_NAME: ${UNITY_CATALOG_NAME:-lakehouse}
      # Sal de los seudónimos de Silver (TD-004): solo la recibe la transformación.
      PII_HASH_SALT: ${PII_HASH_SALT:?falta PII_HASH_SALT en .env}
      POLARS_MAX_THREADS: "4"
    networks: [lakehouse]
    healthcheck:
      # Deja de pasar si un contrato de Silver se incumple (TD-011).
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/medallion-worker.alive) )) -lt 300"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M

  # Compactación y limpieza diarias de Bronze, con un usuario de MinIO propio (TD-007).
  bronze-maintenance:
    <<: [*service, *worker]
    profiles: ["apps"]
    command: ["python", "-m", "medallion_worker", "maintain"]
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    environment:
      <<: *s3-env
      S3_ACCESS_KEY_ID: ${MAINTENANCE_S3_ACCESS_KEY_ID:?falta MAINTENANCE_S3_ACCESS_KEY_ID en .env}
      S3_SECRET_ACCESS_KEY: ${MAINTENANCE_S3_SECRET_ACCESS_KEY:?falta MAINTENANCE_S3_SECRET_ACCESS_KEY en .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      WORKER_CONSUMER_GROUP: ${WORKER_CONSUMER_GROUP:-medallion-worker}
      WORKER_PARTITIONED_TABLES: ${WORKER_PARTITIONED_TABLES:-}
      WORKER_MAINTENANCE_HOUR: ${WORKER_MAINTENANCE_HOUR:-3}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-bronze}
      POLARS_MAX_THREADS: "2"
    networks: [lakehouse]
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/medallion-worker.alive) )) -lt 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  backend:
    <<: *service
    image: odoo-lakehouse/backend:dev
    build:
      context: ./services/backend
    profiles: ["apps"]
    depends_on:
      trino:
        condition: service_healthy
        required: false
      ollama:
        condition: service_healthy
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRINO_HOST: ${TRINO_HOST:-trino}
      TRINO_PORT: ${TRINO_PORT:-8080}
      TRINO_USER: ${TRINO_USER:-text2sql}
      TRINO_CATALOG: ${TRINO_CATALOG:-lakehouse}
      TRINO_SCHEMA: ${TRINO_SCHEMA:-gold}
      UNITY_CATALOG_URL: ${UNITY_CATALOG_URL:-http://unity-catalog:8080}
      UNITY_CATALOG_NAME: ${UNITY_CATALOG_NAME:-lakehouse}
      # nim envía el esquema y la pregunta a NVIDIA (TD-021). ollama no sale del host.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b-instruct-q4_K_M}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NIM_MODEL: ${NIM_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      NIM_API_KEY: ${NIM_API_KEY:-}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-1000}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-60}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      # Trazas de cada pregunta, sin filas de resultados.
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    networks: [edge-app, lakehouse]
    ports:
      - "127.0.0.1:${BACKEND_PORT_HOST:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M

  frontend:
    <<: *service
    image: odoo-lakehouse/frontend:dev
    build:
      context: ./services/frontend
    profiles: ["apps"]
    depends_on:
      - backend
    environment:
      NODE_OPTIONS: --max-old-space-size=160
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    networks: [edge-app]
    ports:
      - "127.0.0.1:${FRONTEND_PORT_HOST:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------------------------------------------------------------------------
  # 6 · Observabilidad del LLM: Langfuse 2 (sin parches de seguridad, ver TD-023)
  # ---------------------------------------------------------------------------
  langfuse-db:
    <<: *service
    image: postgres:15.20-bookworm
    profiles: ["observability"]
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?falta LANGFUSE_DB_PASSWORD en .env}
    networks: [langfuse]
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192M

  # Solo en 127.0.0.1: Caddy no lo publica. Las trazas incluyen prompts y SQL.
  langfuse:
    <<: *service
    image: langfuse/langfuse:2.95.11
    profiles: ["observability"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?falta LANGFUSE_DB_PASSWORD en .env}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT_HOST:-3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?falta LANGFUSE_NEXTAUTH_SECRET en .env}
      SALT: ${LANGFUSE_SALT:?falta LANGFUSE_SALT en .env}
      # 64 caracteres hexadecimales: openssl rand -hex 32
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?falta LANGFUSE_ENCRYPTION_KEY en .env}
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=512
      TELEMETRY_ENABLED: "false"
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: lakehouse
      LANGFUSE_INIT_ORG_NAME: Lakehouse
      LANGFUSE_INIT_PROJECT_ID: text2sql
      LANGFUSE_INIT_PROJECT_NAME: Text-to-SQL
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?falta LANGFUSE_PUBLIC_KEY en .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?falta LANGFUSE_SECRET_KEY en .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:-admin@example.org}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:?falta LANGFUSE_USER_PASSWORD en .env}
    networks: [langfuse, lakehouse]
    ports:
      - "127.0.0.1:${LANGFUSE_PORT_HOST:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      # El primer arranque aplica todas las migraciones de base de datos.
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 640M

  # ---------------------------------------------------------------------------
  # 7 · Entrada externa (ver README, exposición para la defensa del TFG)
  # ---------------------------------------------------------------------------
  caddy:
    <<: *service
    image: odoo-lakehouse/caddy:dev
    build:
      context: ./infra/caddy
    profiles: ["caddy"]
    # Por defecto, la exposición no se reanuda sola tras reiniciar. Solo cambia si .env lo pide
    # (demo pública permanente, TD-022).
    restart: "${CADDY_RESTART:-no}"
    environment:
      CADDY_TLS: ${CADDY_TLS:-internal}
      CADDY_APP_HOST: ${CADDY_APP_HOST:-app.localhost}
      CADDY_ODOO_HOST: ${CADDY_ODOO_HOST:-odoo.localhost}
      CADDY_BASIC_AUTH_USER: ${CADDY_BASIC_AUTH_USER:?falta CADDY_BASIC_AUTH_USER en .env}
      CADDY_BASIC_AUTH_HASH: ${CADDY_BASIC_AUTH_HASH:?falta CADDY_BASIC_AUTH_HASH en .env}
    networks: [edge-odoo, edge-app]
    ports:
      # 127.0.0.1 salvo que se cambie CADDY_BIND_IP: exponer es un acto explícito.
      - "${CADDY_BIND_IP:-127.0.0.1}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_IP:-127.0.0.1}:${CADDY_HTTPS_PORT:-443}:443"
      # Odoo, cuando comparte nombre con el frontend (CADDY_ODOO_HOST=nombre:8443).
      - "${CADDY_BIND_IP:-127.0.0.1}:${CADDY_ODOO_HTTPS_PORT:-8443}:8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  edge-odoo:
  edge-app:
  source:
  lakehouse:
  langfuse:

volumes:
  odoo-db-data:
  odoo-data:
  kafka-data:
  minio-data:
  unity-catalog-db:
  trino-data:
  ollama-models:
  langfuse-db-data:
  caddy-data:
  caddy-config:
