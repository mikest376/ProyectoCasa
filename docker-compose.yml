# =============================================================================
# Odoo Data Lakehouse · estructura inicial (Fase 0)
#
# PRESUPUESTO DE MEMORIA: 19712 MiB de límites sobre los 22528 MiB de WSL.
# Un cambio de límite obliga a actualizar la tabla de CLAUDE.md en el mismo commit.
#
# Nada arranca sin un perfil explícito:
#   source     PostgreSQL 15 + Odoo 17
#   streaming  Kafka (KRaft) + Debezium Connect
#   lakehouse  MinIO + Unity Catalog OSS
#   query      Trino
#   ai         Ollama con GPU NVIDIA
#   apps       Worker + FastAPI + Next.js (sin Dockerfile hasta las fases 2, 4 y 5)
#
# Validar sin arrancar nada:
#   docker compose --env-file .env.example --profile "*" config --quiet
#
# Todos los puertos se publican solo en 127.0.0.1: el MVP no tiene autenticación.
# =============================================================================

name: odoo-lakehouse

x-service: &service
  restart: unless-stopped
  networks:
    - lakehouse
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-s3-env: &s3-env
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?falta S3_ACCESS_KEY_ID en .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?falta S3_SECRET_ACCESS_KEY en .env}

services:
  # ---------------------------------------------------------------------------
  # 1 · Origen
  # ---------------------------------------------------------------------------
  odoo-db:
    <<: *service
    image: postgres:15.20-bookworm
    profiles: ["source"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${ODOO_DB_NAME:-odoo}
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?falta ODOO_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${ODOO_DB_PORT_HOST:-5433}:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M

  odoo:
    <<: *service
    image: odoo:17.0-20260908
    profiles: ["source"]
    depends_on:
      odoo-db:
        condition: service_healthy
    # workers=0: modo multihilo, un solo proceso dentro del presupuesto de memoria.
    command: ["odoo", "--workers=0", "--max-cron-threads=1", "--db-filter=^${ODOO_DB_NAME:-odoo}$$"]
    environment:
      TZ: ${TZ:-UTC}
      HOST: odoo-db
      PORT: "5432"
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:?falta ODOO_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${ODOO_PORT_HOST:-8069}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

  # ---------------------------------------------------------------------------
  # 2 · CDC y streaming
  # ---------------------------------------------------------------------------
  kafka:
    <<: *service
    image: apache/kafka:4.3.2
    profiles: ["streaming"]
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?falta KAFKA_CLUSTER_ID en .env}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT_HOST:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      # Los topics los crea Connect (topic.creation.*); así un error tipográfico
      # en un consumidor no genera topics fantasma.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    ports:
      - "127.0.0.1:${KAFKA_PORT_HOST:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Comprobación TCP: las CLI de Kafka arrancan otra JVM que heredaría
      # KAFKA_HEAP_OPTS y podría agotar el límite de memoria del contenedor.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/19092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1280M

  kafka-connect:
    <<: *service
    image: quay.io/debezium/connect:3.7.1.Final
    profiles: ["streaming"]
    hostname: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: odoo-lakehouse-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Permite usar ${env:DEBEZIUM_DB_PASSWORD} en el JSON del conector, de modo
      # que la contraseña no se escribe en el repositorio ni en la API de Connect.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ^DEBEZIUM_.*
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?falta DEBEZIUM_DB_PASSWORD en .env}
      # El valor por defecto de la imagen es -Xmx2G y excede el presupuesto.
      HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:${CONNECT_PORT_HOST:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://kafka-connect:8083/connectors >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1280M

  # ---------------------------------------------------------------------------
  # 3 · Almacenamiento y catálogo
  # ---------------------------------------------------------------------------
  minio:
    <<: *service
    # MinIO ya no publica imágenes oficiales (ver TD-003). Imagen de Chainguard
    # fijada por digest porque su nivel gratuito solo ofrece el tag "latest".
    image: &minio-image cgr.dev/chainguard/minio:latest@sha256:f2e56aceb4d38ad9b05c901270946e2353b19f86ba4396f25cf75b15b455b38c
    profiles: ["lakehouse"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT_HOST:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M

  # Tarea de un solo uso: crea los buckets Medallion y termina.
  minio-init:
    <<: *service
    image: *minio-image
    profiles: ["lakehouse"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
      BUCKETS: ${S3_BUCKET_BRONZE:-bronze} ${S3_BUCKET_SILVER:-silver} ${S3_BUCKET_GOLD:-gold}
    entrypoint: ["/usr/bin/bash", "-euc"]
    command:
      - |
        mc alias set lake http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        for bucket in $$BUCKETS; do
          mc mb --ignore-existing "lake/$$bucket"
        done
    deploy:
      resources:
        limits:
          memory: 128M

  unity-catalog:
    <<: *service
    image: unitycatalog/unitycatalog:v0.7.0
    profiles: ["lakehouse"]
    environment:
      # La imagen no fija heap; la JVM lee esta variable de forma automática.
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${UNITY_CATALOG_PORT_HOST:-8081}:8080"
    volumes:
      - unity-catalog-db:/home/unitycatalog/etc/db
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/2.1/unity-catalog/catalogs"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768M

  # ---------------------------------------------------------------------------
  # 4 · Consulta e IA
  # ---------------------------------------------------------------------------
  trino:
    <<: *service
    image: trinodb/trino:484
    profiles: ["query"]
    environment:
      <<: *s3-env
    ports:
      - "127.0.0.1:${TRINO_PORT_HOST:-8080}:8080"
    volumes:
      - ./infra/trino/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - trino-data:/data/trino
    # Healthcheck: el que trae la propia imagen (/usr/lib/trino/bin/health-check).
    deploy:
      resources:
        limits:
          memory: 5120M # heap 4 GiB (jvm.config) + memoria fuera de heap

  ollama:
    <<: *service
    image: ollama/ollama:0.40.18
    profiles: ["ai"]
    environment:
      # Un modelo y una petición a la vez: la VRAM no admite más (ver CLAUDE.md).
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Los datos del ERP no deben salir del host.
      OLLAMA_NO_CLOUD: "1"
    ports:
      - "127.0.0.1:${OLLAMA_PORT_HOST:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 5120M # margen para capas del modelo descargadas a CPU (TD-001)
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # 5 · Servicios propios (contextos de build vacíos hasta su fase)
  # ---------------------------------------------------------------------------
  medallion-worker:
    <<: *service
    image: odoo-lakehouse/medallion-worker:dev
    build:
      context: ./services/medallion-worker
    profiles: ["apps"]
    depends_on:
      kafka:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
        required: false
      unity-catalog:
        condition: service_healthy
        required: false
    environment:
      <<: *s3-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      WORKER_CONSUMER_GROUP: ${WORKER_CONSUMER_GROUP:-medallion-worker}
      WORKER_TOPIC_PATTERN: ${WORKER_TOPIC_PATTERN:-}
      WORKER_BATCH_MAX_RECORDS: ${WORKER_BATCH_MAX_RECORDS:-5000}
      WORKER_BATCH_MAX_SECONDS: ${WORKER_BATCH_MAX_SECONDS:-30}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-bronze}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:-silver}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:-gold}
      UNITY_CATALOG_URL: ${UNITY_CATALOG_URL:-http://unity-catalog:8080}
      UNITY_CATALOG_NAME: ${UNITY_CATALOG_NAME:-lakehouse}
      POLARS_MAX_THREADS: "4"
    deploy:
      resources:
        limits:
          memory: 1536M

  backend:
    <<: *service
    image: odoo-lakehouse/backend:dev
    build:
      context: ./services/backend
    profiles: ["apps"]
    depends_on:
      trino:
        condition: service_healthy
        required: false
      ollama:
        condition: service_healthy
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRINO_HOST: ${TRINO_HOST:-trino}
      TRINO_PORT: ${TRINO_PORT:-8080}
      TRINO_USER: ${TRINO_USER:-text2sql}
      TRINO_CATALOG: ${TRINO_CATALOG:-lakehouse}
      TRINO_SCHEMA: ${TRINO_SCHEMA:-gold}
      UNITY_CATALOG_URL: ${UNITY_CATALOG_URL:-http://unity-catalog:8080}
      UNITY_CATALOG_NAME: ${UNITY_CATALOG_NAME:-lakehouse}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b-instruct-q4_K_M}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-1000}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-60}
    ports:
      - "127.0.0.1:${BACKEND_PORT_HOST:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    <<: *service
    image: odoo-lakehouse/frontend:dev
    build:
      context: ./services/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    profiles: ["apps"]
    depends_on:
      - backend
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:${FRONTEND_PORT_HOST:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  lakehouse:
    driver: bridge

volumes:
  odoo-db-data:
  odoo-data:
  kafka-data:
  minio-data:
  unity-catalog-db:
  trino-data:
  ollama-models:
