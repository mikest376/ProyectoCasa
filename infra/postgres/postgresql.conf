# PostgreSQL 15 · origen de Odoo con CDC lógico
# Límite del contenedor: 512 MiB (ver CLAUDE.md antes de subir valores de memoria).

listen_addresses = '*'
max_connections = 60
timezone = 'UTC'
log_timezone = 'UTC'

# --- CDC: Debezium con pgoutput ---------------------------------------------
wal_level = logical
max_replication_slots = 4
max_wal_senders = 4
# Tope de WAL retenido si el conector se detiene. Al superarlo, PostgreSQL
# invalida el slot y hace falta un nuevo snapshot (ver TD-006).
max_slot_wal_keep_size = 4GB
max_wal_size = 1GB

# --- Memoria ------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
maintenance_work_mem = 64MB
