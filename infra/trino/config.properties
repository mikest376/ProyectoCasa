# Trino 484 · nodo único (coordinador y worker en el mismo proceso)
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=static

# Presupuesto sobre un heap de 2 GB: memoria por consulta + reserva <= heap.
# No se declara cache-manager.config-files: la configuración por defecto de la
# imagen reserva 2 GB de caché en memoria y no cabe en este presupuesto.
query.max-memory=800MB
query.max-memory-per-node=800MB
memory.heap-headroom-per-node=512MB

# Cortafuegos para consultas generadas por el LLM
query.max-execution-time=2m
query.max-run-time=3m
query.max-history=50
